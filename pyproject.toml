[project]
name = "earnings-screener"
version = "1.0.0"
description = "Earnings calendar screener for option calendar spreads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Klemen Rajer", email = "klemen.rajer@gmail.com" }]
keywords = ["options", "earnings", "trading", "calendar-spreads", "volatility", "screening"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "yfinance>=0.2",
    "pytz>=2023.3",
    "pandas_market_calendars>=4.4",
    "scipy>=1.10",
    "rich>=13.9",
    "tabulate>=0.9",
]

[project.optional-dependencies]
uw = ["playwright>=1.40"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.5",
]
all = ["playwright>=1.40"]

[project.scripts]
earnings-screener = "earnings_screener.cli:main"

[project.urls]
Homepage = "https://github.com/klemen-r/earnings-vol-arb"
Documentation = "https://github.com/klemen-r/earnings-vol-arb/blob/main/README.md"
Repository = "https://github.com/klemen-r/earnings-vol-arb"
Issues = "https://github.com/klemen-r/earnings-vol-arb/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
